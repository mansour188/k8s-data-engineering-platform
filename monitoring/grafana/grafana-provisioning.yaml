apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: observability
data:
  postgres.yaml: |
    apiVersion: 1

    datasources:
      - name: Analytics PostgreSQL
        uid: analytics-postgres
        type: postgres
        access: proxy
        url: postgres-data.data-platform.svc.cluster.local:5432

        user: ${POSTGRES_USER}

        secureJsonData:
          password: ${POSTGRES_PASSWORD}

        jsonData:
          database: analytics
          sslmode: disable
          postgresVersion: 1600
          timescaledb: false

        isDefault: false
        editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  provider.yaml: |
    apiVersion: 1

    providers:
      - name: Data Platform
        orgId: 1
        folder: Data Platform
        type: file
        disableDeletion: false
        editable: true

        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
