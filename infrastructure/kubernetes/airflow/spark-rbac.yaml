apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-sparkapplication-role
  namespace: data-platform

rules:
  - apiGroups:
      - sparkoperator.k8s.io
    resources:
      - sparkapplications
    verbs:
      - get
      - list
      - watch
      - create
      - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-sparkapplication-rolebinding
  namespace: data-platform

subjects:
  - kind: ServiceAccount
    name: airflow-worker
    namespace: data-platform

roleRef:
  kind: Role
  name: airflow-sparkapplication-role
  apiGroup: rbac.authorization.k8s.io
