apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: data-platform

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: data-platform

rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - deletecollection
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: data-platform

subjects:
  - kind: ServiceAccount
    name: spark
    namespace: data-platform

roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
