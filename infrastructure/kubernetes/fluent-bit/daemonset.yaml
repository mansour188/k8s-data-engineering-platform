apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: data-platform

spec:
  selector:
    matchLabels:
      app: fluent-bit

  template:
    metadata:
      labels:
        app: fluent-bit

    spec:
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.2

          envFrom:
            - secretRef:
                name: minio-credentials

          volumeMounts:
            - name: varlog
              mountPath: /var/log

            - name: config
              mountPath: /fluent-bit/etc

      volumes:
        - name: varlog
          hostPath:
            path: /var/log

        - name: config
          configMap:
            name: fluent-bit-config
