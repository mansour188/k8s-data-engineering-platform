apiVersion: v1
kind: Secret
metadata:
  name: postgres-data-credentials
  namespace: data-platform
type: Opaque
stringData:
  POSTGRES_USER: analytics
  POSTGRES_PASSWORD: analytics123
  POSTGRES_DB: analytics
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data-pvc
  namespace: data-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-data
  namespace: data-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-data
  template:
    metadata:
      labels:
        app: postgres-data
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-data-credentials
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-data
  namespace: data-platform
spec:
  selector:
    app: postgres-data
  ports:
    - port: 5432
      targetPort: 5432
